<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Otter Music · 在线版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='%2322c55e'/%3E%3C/svg%3E">
<style>
:root{--bg:#070b11;--pn:#0b111a;--ln:#1b2635;--tx:#e9f0f8;--dm:#8b98a8;--ac:#22c55e}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);overflow:hidden;font:14px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif}
#app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:minmax(0,1fr) 92px;height:100vh;overflow:hidden}
aside{background:var(--pn);border-right:1px solid var(--ln);padding:16px 12px;display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:0}
.brand{display:flex;align-items:center;gap:9px;padding:0 6px 6px}
.bdot{width:11px;height:11px;border-radius:50%;background:var(--ac);box-shadow:0 0 16px var(--ac)}
.brand b{font-size:18px;letter-spacing:.3px}
.nt{font-size:11px;color:var(--dm);letter-spacing:2px;padding:0 6px}
.nv{display:flex;flex-direction:column;gap:3px}
.nv a{display:block;padding:9px 12px;border-radius:9px;color:#c6d2e0;cursor:pointer}
.nv a:hover{background:#111d29;color:#fff}
.nv a.on{background:#12241a;color:#5ee08a}
.fl{display:flex;flex-direction:column;gap:2px}
.fl .it{padding:6px 9px;border-radius:7px;font-size:12px;color:#93a2b3;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .it:hover{background:#111d29;color:#fff}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
#top{display:flex;gap:10px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--ln)}
#q{flex:1;height:42px;background:#0d1621;border:1px solid var(--ln);border-radius:11px;color:var(--tx);padding:0 14px;font:inherit;outline:none}
#q:focus{border-color:#2c4a36}
.b{height:42px;padding:0 16px;border-radius:11px;border:1px solid var(--ln);background:#111c28;color:var(--tx);font:inherit;cursor:pointer}
.b:hover{background:#16263a}
.b.p{background:var(--ac);border-color:var(--ac);color:#04200f;font-weight:700}
select{height:42px;border-radius:11px;border:1px solid var(--ln);background:#111c28;color:var(--tx);font:inherit;padding:0 8px}
#bd{flex:1;overflow:auto;padding:16px 18px 22px;min-height:0}
#hd{display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
#hd h2{font-size:24px}
#hd s{color:var(--dm);font-size:13px;text-decoration:none}
#ls{display:flex;flex-direction:column;gap:5px}
.r{display:grid;grid-template-columns:38px 52px 1fr auto;gap:12px;align-items:center;padding:7px 10px;border-radius:11px;cursor:pointer;border:1px solid transparent}
.r:hover{background:#101a26}
.r.on{background:#12241a;border-color:#22c55e55}
.r .n{text-align:center;color:var(--dm);font-size:13px}
.r.on .n{color:var(--ac)}
.r .c{width:52px;height:52px;border-radius:9px;background:#16232f center/cover;display:flex;align-items:center;justify-content:center;color:#5b6a7b;font-size:17px}
.r .m{min-width:0}
.r .m b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .m i{display:block;font-style:normal;font-size:12px;color:var(--dm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .a{display:flex;gap:7px;opacity:0;transition:.15s}
.r:hover .a,.r.on .a{opacity:1}
.ib{width:34px;height:34px;border-radius:8px;border:1px solid var(--ln);background:#0f1a26;color:#b9c6d4;display:grid;place-items:center;cursor:pointer}
.ib:hover{color:#fff;border-color:#2c4a36}
.ib.f{color:var(--ac);border-color:#22c55e55}
#pl{grid-column:1/3;border-top:1px solid var(--ln);background:#080e15;display:grid;grid-template-columns:minmax(200px,300px) 1fr auto;gap:16px;align-items:center;padding:10px 18px}
#np{display:flex;gap:10px;align-items:center;min-width:0}
#np .c{width:60px;height:60px;border-radius:9px;background:#16232f center/cover;flex:0 0 auto}
#np b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#np i{font-style:normal;font-size:12px;color:var(--dm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
#ct{display:flex;flex-direction:column;gap:7px;min-width:0}
#r2{display:flex;gap:12px;align-items:center}
#bar{flex:1;height:5px;background:#16232f;border-radius:9px;position:relative;cursor:pointer}
#bar .f{position:absolute;inset:0 auto 0 0;width:0;background:var(--ac);border-radius:9px}
.tm{font-size:11px;color:var(--dm);min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
#bt{display:flex;gap:9px;align-items:center}
.pb{width:38px;height:38px;border-radius:50%;border:1px solid var(--ln);background:#101a26;color:#dfe9f3;display:grid;place-items:center;cursor:pointer}
.pb:hover{background:#16263a}
.pb.bg{width:48px;height:48px;background:var(--ac);border-color:var(--ac);color:#04200f}
.pb svg{width:17px;height:17px}
.pb.bg svg{width:21px;height:21px}
#rt{display:flex;gap:9px;align-items:center;font-size:11px;color:var(--dm)}
#vol{width:80px}
#ly{position:fixed;right:0;top:0;bottom:92px;width:320px;background:#0a1219f0;border-left:1px solid var(--ln);padding:20px;overflow:auto;display:none}
#ly.s{display:block}
#ly h3{font-size:13px;color:var(--dm);font-weight:400;margin-bottom:12px;letter-spacing:1px}
#ly .l{font-size:13px;color:#77879a;padding:4px 0}
#ly .l.on{color:#fff}
#tip{position:fixed;left:50%;bottom:112px;transform:translateX(-50%);background:#12202e;border:1px solid #24384c;padding:8px 16px;border-radius:9px;font-size:12px;opacity:0;transition:.2s;pointer-events:none}
#tip.s{opacity:1}
@media(max-width:1000px){#app{grid-template-columns:176px 1fr}.r{grid-template-columns:30px 44px 1fr auto}.r .c{width:44px;height:44px}}
</style>
</head>
<body>
<div id="app">
<aside>
<div class="brand"><span class="bdot"></span><b>Otter Music</b></div>
<div class="nt">榜单</div>
<div class="nv" id="nav">
<a data-c="3778678" class="on">热歌榜</a>
<a data-c="3779629">新歌榜</a>
<a data-c="19723756">飙升榜</a>
<a data-c="2884035">原创榜</a>
</div>
<div class="nt">我的</div>
<div class="nv"><a id="nf">我的收藏</a><a id="nh">最近播放</a></div>
<div class="nt">收藏的歌</div>
<div class="fl" id="fav"></div>
</aside>
<main>
<div id="top">
<input id="q" placeholder="搜歌名或歌手，回车">
<button class="b p" id="bs">搜索</button>
<select id="src"><option value="netease">网易云</option><option value="kuwo">酷我</option><option value="kugou">酷狗</option><option value="migu">咪咕</option></select>
<button class="b" id="bly">歌词</button>
</div>
<div id="bd"><div id="hd"><h2 id="ti">热歌榜</h2><s id="su"></s></div><div id="ls"></div></div>
</main>
<div id="pl">
<div id="np"><div class="c" id="nc"></div><div style="min-width:0"><b id="nt">未在播放</b><i id="na">选一首歌开始</i></div></div>
<div id="ct">
<div id="r2"><div id="bar"><div class="f" id="fill"></div></div><span class="tm" id="t1">0:00</span><span class="tm" id="t2">0:00</span></div>
<div id="bt">
<div class="pb" id="pv"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14l-11-7z"/></svg></div>
<div class="pb bg" id="pp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg></div>
<div class="pb" id="nx"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></div>
<div class="pb" id="lp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 01-4 4H3"/></svg></div>
</div>
</div>
<div id="rt"><span id="br">—</span><input id="vol" type="range" min="0" max="100" value="70"><div class="pb" id="dl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg></div></div>
</div>
</div>
<div id="ly"><h3>歌词</h3><div id="lbody"></div></div>
<div id="tip"></div>
<audio id="au" preload="none"></audio>
<script>
var API='https://music-api.gdstudio.xyz/api.php';
var NAME={'3778678':'热歌榜','3779629':'新歌榜','19723756':'飙升榜','2884035':'原创榜'};
var S={list:[],i:-1,src:'netease',fav:load('om_fav'),his:load('om_his'),loop:0,ly:[],li:-1};
var au=document.getElementById('au');
au.volume=.7;
function load(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return []}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){} }
function $(s){return document.querySelector(s)}
function tip(m){var e=$('#tip');e.textContent=m;e.classList.add('s');clearTimeout(e.tm);e.tm=setTimeout(function(){e.classList.remove('s')},1700)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(t){if(!isFinite(t)||t<0)return '0:00';var m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s}
function api(o){return req(o,3)}
function req(o,n){
var u=new URL(API);
u.searchParams.set('types',o.types);
u.searchParams.set('source',o.source||S.src);
for(var k in o){if(k!=='types'&&k!=='source')u.searchParams.set(k,o[k])}
return fetch(u.toString(),{cache:'no-store'}).then(function(r){
if(!r.ok)throw new Error('接口 '+r.status);
return r.json();
}).catch(function(e){
if(n>1)return new Promise(function(res){setTimeout(res,1500)}).then(function(){return req(o,n-1)});
throw e;
});
}
function norm(t,src){
var ar=t.ar?t.ar.map(function(a){return a.name}).join(' / '):(Array.isArray(t.artist)?t.artist.join(' / '):(t.artist||'未知'));
return {id:String(t.id),name:t.name||'未知',artist:ar,cover:(t.al&&t.al.picUrl)||t.pic||'',album:(t.al&&t.al.name)||'',src:src||S.src};
}
function chart(id){
$('#ti').textContent=NAME[id];$('#su').textContent='加载中…';$('#ls').innerHTML='';
api({types:'playlist',id:id}).then(function(d){
var p=(d&&d.playlist)||{};
S.list=(p.tracks||[]).map(function(t){return norm(t,'netease')});
$('#ti').textContent=p.name||NAME[id];
$('#su').textContent='网易云榜单 · '+S.list.length+' 首';
draw();
}).catch(function(e){$('#su').textContent='加载失败，点这里重试';$('#su').style.cursor='pointer';$('#su').onclick=function(){chart(id)}});
}
function search(){
var kw=$('#q').value.trim();
if(!kw){tip('先输入歌名或歌手');return}
$('#ti').textContent='搜索：'+kw;$('#su').textContent='加载中…';$('#ls').innerHTML='';
api({types:'search',name:kw,count:30,pages:1}).then(function(d){
S.list=(Array.isArray(d)?d:[]).map(function(t){return norm(t)});
$('#su').textContent=S.list.length+' 首结果';
draw();
}).catch(function(e){$('#su').textContent='搜索失败：'+e.message});
}
function draw(){
var box=$('#ls');box.innerHTML='';
S.list.forEach(function(t,i){
var d=document.createElement('div');
d.className='r'+(i===S.i?' on':'');
var isF=S.fav.some(function(f){return f.id===t.id});
d.innerHTML='<div class="n">'+(i+1)+'</div>'
+'<div class="c"'+(t.cover?' style="background-image:url(&quot;'+t.cover+'&quot;)"':'')+'>'+(t.cover?'':esc(t.name.slice(0,1)))+'</div>'
+'<div class="m"><b>'+esc(t.name)+'</b><i>'+esc(t.artist)+(t.album?' · '+esc(t.album):'')+'</i></div>'
+'<div class="a"><button class="ib'+(isF?' f':'')+'" data-f="'+i+'" title="收藏">&#9829;</button>'
+'<button class="ib" data-d="'+i+'" title="下载">&#8595;</button></div>';
d.onclick=function(e){
var f=e.target.getAttribute('data-f'),g=e.target.getAttribute('data-d');
if(f){fav(+f);return}
if(g){dl(+g);return}
play(i);
};
box.appendChild(d);
});
}
function mark(){
var rs=$('#ls').children;
for(var i=0;i<rs.length;i++)rs[i].classList.toggle('on',i===S.i);
}
function play(i){
var t=S.list[i];if(!t)return;
S.i=i;mark();
$('#nt').textContent=t.name;$('#na').textContent=t.artist;
$('#nc').style.backgroundImage=t.cover?'url("'+t.cover+'")':'none';
api({types:'url',id:t.id,source:t.src,br:320}).then(function(d){
if(!d.url){tip('这个音源没有版权，换个音源再试');return}
au.src=d.url;au.play();
$('#br').textContent=(d.br?d.br+'k':'')+(d.size?' · '+(d.size/1048576).toFixed(1)+'MB':'');
S.his=S.his.filter(function(x){return x.id!==t.id});S.his.unshift(t);S.his=S.his.slice(0,30);save('om_his',S.his);
lyric(t.id,t.src);
}).catch(function(e){tip('取播放地址失败：'+e.message)});
}
function tog(){if(!au.src)return;au.paused?au.play():au.pause()}
au.onplay=function(){$('#pp').innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>'};
au.onpause=function(){$('#pp').innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>'};
au.ontimeupdate=function(){
var d=au.duration||0;
$('#fill').style.width=d?(au.currentTime/d*100)+'%':'0%';
$('#t1').textContent=fmt(au.currentTime);$('#t2').textContent=fmt(d);
if(S.ly.length)sync(au.currentTime);
};
au.onended=function(){ if(S.loop===1){au.currentTime=0;au.play()}else nex() };
au.onerror=function(){if(au.src)tip('播放失败，换个音源试试')};
function nex(){if(S.list.length)play((S.i+1)%S.list.length)}
function prv(){if(S.list.length)play((S.i-1+S.list.length)%S.list.length)}
function lyric(id,src){
S.ly=[];S.li=-1;$('#lbody').innerHTML='';
api({types:'lyric',id:id,source:src}).then(function(d){
var raw=d.lyric||'';
S.ly=raw.split(/\n/).map(function(l){
var m=l.match(/\[(\d+):(\d+(?:\.\d+)?)\](.*)/);
return m?{t:(+m[1])*60+parseFloat(m[2]),s:m[3].trim()}:null;
}).filter(function(x){return x&&x.s});
$('#lbody').innerHTML=S.ly.map(function(l,i){return '<div class="l" data-i="'+i+'">'+esc(l.s)+'</div>'}).join('')||'<div class="l">没有歌词</div>';
}).catch(function(){$('#lbody').innerHTML='<div class="l">没有歌词</div>'});
}
function sync(cur){
var idx=-1;
for(var i=0;i<S.ly.length;i++){if(S.ly[i].t<=cur)idx=i;else break}
if(idx===S.li)return;S.li=idx;
var ns=$('#lbody').children;
for(var j=0;j<ns.length;j++)ns[j].classList.toggle('on',j===idx);
if(ns[idx]&&ns[idx].scrollIntoView)ns[idx].scrollIntoView({block:'center'});
}
function fav(i){
var t=S.list[i];if(!t)return;
var k=S.fav.findIndex(function(f){return f.id===t.id});
if(k>=0){S.fav.splice(k,1);tip('已取消收藏')}else{S.fav.unshift(t);tip('已收藏')}
save('om_fav',S.fav);fbox();draw();
}
function fbox(){
var b=$('#fav');
b.innerHTML=S.fav.slice(0,12).map(function(f,i){return '<div class="it" data-x="'+i+'">'+esc(f.name)+'</div>'}).join('')||'<div class="it">还没有收藏</div>';
Array.prototype.forEach.call(b.children,function(el){
var i=el.getAttribute('data-x');
if(i!==null)el.onclick=function(){S.list=S.fav.slice();$('#ti').textContent='我的收藏';$('#su').textContent=S.fav.length+' 首';S.i=-1;draw();play(+i)};
});
}
function dl(i){
var t=S.list[i===undefined?S.i:i];if(!t){tip('先选一首歌');return}
tip('正在准备下载…');
api({types:'url',id:t.id,source:t.src,br:320}).then(function(d){
if(!d.url){tip('这个音源没有版权，换音源再试');return}
return fetch(d.url).then(function(r){return r.blob()}).then(function(b){
var a=document.createElement('a');
a.href=URL.createObjectURL(b);
a.download=t.artist+' - '+t.name+'.mp3';a.click();
setTimeout(function(){URL.revokeObjectURL(a.href)},5000);
tip('已开始下载');
});
}).catch(function(e){tip('下载失败：'+e.message)});
}
Array.prototype.forEach.call($('#nav').children,function(a){
a.onclick=function(){
Array.prototype.forEach.call($('#nav').children,function(x){x.classList.remove('on')});
a.classList.add('on');S.src='netease';$('#src').value='netease';chart(a.getAttribute('data-c'));
};
});
$('#nf').onclick=function(){
if(!S.fav.length){tip('还没有收藏的歌');return}
S.list=S.fav.slice();$('#ti').textContent='我的收藏';$('#su').textContent=S.fav.length+' 首';S.i=-1;draw();
};
$('#nh').onclick=function(){
if(!S.his.length){tip('还没有播放记录');return}
S.list=S.his.slice();$('#ti').textContent='最近播放';$('#su').textContent=S.his.length+' 首';S.i=-1;draw();
};
$('#bs').onclick=search;
$('#q').addEventListener('keydown',function(e){if(e.key==='Enter')search()});
$('#pp').onclick=tog;
$('#nx').onclick=nex;
$('#pv').onclick=prv;
$('#dl').onclick=function(){dl()};
$('#vol').oninput=function(){au.volume=this.value/100};
$('#bar').onclick=function(e){
if(!au.duration)return;
var r=this.getBoundingClientRect();
au.currentTime=((e.clientX-r.left)/r.width)*au.duration;
};
$('#bly').onclick=function(){$('#ly').classList.toggle('s')};
$('#src').onchange=function(){S.src=this.value;tip('音源已切到 '+this.options[this.selectedIndex].text)};
$('#lp').onclick=function(){S.loop=(S.loop+1)%3;tip(['列表循环','单曲循环','顺序播放'][S.loop])};
document.addEventListener('keydown',function(e){
if(e.target.tagName==='INPUT')return;
if(e.code==='Space'){e.preventDefault();tog()}
});
fbox();chart('3778678');
</script>
</body>
</html>

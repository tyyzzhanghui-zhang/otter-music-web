<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otter Music · 网页版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%2322c55e'/%3E%3C/svg%3E">
<style>
:root{--bg:#070b11;--panel:#0b111a;--line:#1b2635;--txt:#e9f0f8;--dim:#8b98a8;--accent:#22c55e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);overflow:hidden;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{display:grid;grid-template-columns:236px 1fr;grid-template-rows:1fr 96px;height:100vh}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;padding:18px 14px;gap:18px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 8px}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 16px var(--accent)}
.brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.4px}
.navTitle{font-size:12px;color:var(--dim);letter-spacing:2px;padding:0 8px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#c6d2e0;text-decoration:none;font-size:15px;cursor:pointer}
.nav a:hover{background:#111d29;color:#fff}
.nav a.on{background:#12241a;color:#5ee08a}
.nav a svg{width:18px;height:18px;opacity:.85;flex:0 0 auto}
.fav-list{display:flex;flex-direction:column;gap:2px}
.fav-list .it{padding:7px 10px;border-radius:8px;font-size:13px;color:#9aa8b8;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav-list .it:hover{background:#111d29;color:#fff}
main{display:flex;flex-direction:column;min-width:0}
#topbar{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line)}
#q{flex:1;height:44px;background:#0d1621;border:1px solid var(--line);border-radius:12px;color:var(--txt);padding:0 16px;font-size:15px;font-family:inherit;outline:none}
#q:focus{border-color:#2c4a36;box-shadow:0 0 0 3px rgba(34,197,94,.14)}
.btn{height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:#111c28;color:var(--txt);font-size:14px;cursor:pointer;font-family:inherit}
.btn:hover{background:#16263a}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#04200f;font-weight:700}
.selbox{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
select{background:#111c28;color:var(--txt);border:1px solid var(--line);border-radius:10px;height:44px;padding:0 10px;font-family:inherit;font-size:14px}
#body{flex:1;overflow:auto;padding:18px 22px 24px}
#headline{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}
#headline h2{margin:0;font-size:26px}
#headline .sub{color:var(--dim);font-size:14px}
#list{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:44px 56px 1fr auto;gap:14px;align-items:center;padding:8px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.row:hover{background:#101a26}
.row.on{background:#12241a;border-color:#22c55e55}
.row .no{text-align:center;color:var(--dim);font-size:14px}
.row.on .no{color:var(--accent)}
.row .cv{width:56px;height:56px;border-radius:10px;background:#16232f center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:18px;color:#5b6a7b}
.row .meta{min-width:0}
.row .meta b{display:block;font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta i{display:block;font-style:normal;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .act{display:flex;gap:8px;opacity:0;transition:.15s}
.row:hover .act,.row.on .act{opacity:1}
.iconbtn{width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:#0f1a26;color:#b9c6d4;display:flex;align-items:center;justify-content:center;cursor:pointer}
.iconbtn:hover{color:#fff;border-color:#2c4a36}
.iconbtn.fav{color:var(--accent);border-color:#22c55e55}
#player{grid-column:1/3;border-top:1px solid var(--line);background:#080e15;display:grid;grid-template-columns:minmax(220px,320px) 1fr auto;gap:18px;align-items:center;padding:12px 20px}
#np{display:flex;align-items:center;gap:12px;min-width:0}
#np .cv{width:64px;height:64px;border-radius:10px;background:#16232f center/cover no-repeat;flex:0 0 auto}
#np .t{min-width:0}
#np .t b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#np .t i{font-style:normal;font-size:12px;color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
#ctrl{display:flex;flex-direction:column;gap:8px;min-width:0}
#row2{display:flex;align-items:center;gap:14px}
#bar{flex:1;height:6px;background:#16232f;border-radius:99px;position:relative;cursor:pointer}
#bar .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:99px}
.time{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
#btns{display:flex;align-items:center;gap:10px}
.pbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#101a26;color:#dfe9f3;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pbtn:hover{background:#16263a}
.pbtn.big{width:50px;height:50px;background:var(--accent);border-color:var(--accent);color:#04200f}
.pbtn svg{width:18px;height:18px}
.pbtn.big svg{width:22px;height:22px}
#right{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12px}
#vol{width:88px}
#lyric{position:fixed;right:0;top:0;bottom:96px;width:340px;background:#0a1219ee;backdrop-filter:blur(10px);border-left:1px solid var(--line);padding:24px 22px;overflow:auto;display:none}
#lyric.show{display:block}
#lyric h3{margin:0 0 16px;font-size:14px;color:var(--dim);font-weight:500;letter-spacing:1px}
#lyric .ln{font-size:14px;color:#77879a;padding:5px 0;line-height:1.5}
#lyric .ln.on{color:#fff;font-size:15px}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#12202e;border:1px solid #24384c;color:#dce8f4;font-size:13px;padding:9px 18px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
#toast.show{opacity:1}
@media (max-width:1100px){#app{grid-template-columns:190px 1fr}.row{grid-template-columns:34px 48px 1fr auto}.row .cv{width:48px;height:48px}}
</style>
</head>
<body>
<div id="app">
<aside>
<div class="brand"><span class="dot"></span><h1>Otter Music</h1></div>
<div class="navTitle">榜单</div>
<div class="nav" id="navCharts">
<a data-chart="3778678" class="on">热歌榜</a>
<a data-chart="3779629">新歌榜</a>
<a data-chart="19723756">飙升榜</a>
<a data-chart="2884035">原创榜</a>
</div>
<div class="navTitle">我的</div>
<div class="nav">
<a id="navFav">我的收藏</a>
<a id="navHis">最近播放</a>
</div>
<div class="navTitle">收藏的歌</div>
<div class="fav-list" id="favList"></div>
</aside>
<main>
<div id="topbar">
<input id="q" placeholder="搜歌名、歌手，回车搜索">
<button class="btn pri" id="btnSearch">搜索</button>
<div class="selbox">音源
<select id="src"><option value="netease">网易云</option><option value="kuwo">酷我</option><option value="kugou">酷狗</option><option value="migu">咪咕</option></select>
</div>
<button class="btn" id="btnLyric">歌词</button>
</div>
<div id="body">
<div id="headline"><h2 id="title">热歌榜</h2><span class="sub" id="sub"></span></div>
<div id="list"></div>
</div>
</main>
<div id="player">
<div id="np"><div class="cv" id="npCv"></div><div class="t"><b id="npT">未在播放</b><i id="npA">选一首歌开始</i></div></div>
<div id="ctrl">
<div id="row2"><div id="bar"><div class="fill" id="fill"></div></div><span class="time" id="tNow">0:00</span><span class="time" id="tAll">0:00</span></div>
<div id="btns">
<div class="pbtn" id="bPrev"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14l-11-7z"/></svg></div>
<div class="pbtn big" id="bPlay"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg></div>
<div class="pbtn" id="bNext"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></div>
<div class="pbtn" id="bLoop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11v-1a4 4 0 014-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 01-4 4H3"/></svg></div>
</div>
</div>
<div id="right"><span id="brTag">—</span><input id="vol" type="range" min="0" max="100" value="70"><div class="pbtn" id="bDl" title="下载"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg></div></div>
</div>
</div>
<div id="lyric"><h3>歌词</h3><div id="lyricBody" class="ln"></div></div>
<div id="toast"></div>
<audio id="au" preload="none"></audio>
<script>
const API='https://music-api.gdstudio.xyz/api.php';
const CHARTS={'3778678':{name:'热歌榜'},'3779629':{name:'新歌榜'},'19723756':{name:'飙升榜'},'2884035':{name:'原创榜'}};
let state={tracks:[],index:-1,source:'netease',favs:JSON.parse(localStorage.getItem('otter_favs')||'[]'),hist:JSON.parse(localStorage.getItem('otter_hist')||'[]'),loop:0,lyric:[],lyricIdx:-1};
const $=(s)=>document.querySelector(s);
const au=$('#au');au.volume=0.7;
function fmt(t){if(!isFinite(t))return '0:00';const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s}
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1600)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])}
async function api(p){const u=new URL(API);u.searchParams.set('types',p.types);u.searchParams.set('source',p.source||state.source);for(const k in p){if(k!=='types'&&k!=='source')u.searchParams.set(k,p[k])}const r=await fetch(u.toString(),{cache:'no-store'});if(!r.ok)throw new Error('接口 '+r.status);return r.json()}
function normalize(t){return{id:String(t.id),name:t.name||'未知歌曲',artist:(t.ar?t.ar.map(a=>a.name).join(' / '):(Array.isArray(t.artist)?t.artist.join(' / '):(t.artist||'未知')),cover:(t.al&&t.al.picUrl)||t.cover||'',source:t.source||state.source,album:(t.al&&t.al.name)||t.album||''}}
async function loadChart(id){$('#title').textContent=CHARTS[id].name;$('#sub').textContent='加载中…';$('#list').innerHTML='';
try{const d=await api({types:'playlist',source:'netease',id:id});const p=d.playlist||{};state.tracks=(p.tracks||[]).map(normalize);$('#title').textContent=p.name||CHARTS[id].name;$('#sub').textContent='网易云榜单 · '+state.tracks.length+' 首';render()}catch(e){$('#sub').textContent='加载失败，点榜单重试'}}
async function doSearch(){const kw=$('#q').value.trim();if(!kw)return toast('先输入歌名或歌手');$('#title').textContent='搜索：'+kw;$('#sub').textContent='加载中…';$('#list').innerHTML='';
try{const d=await api({types:'search',name:kw,count:30,pages:1});state.tracks=(Array.isArray(d)?d:[]).map(normalize);$('#sub').textContent=state.tracks.length+' 首结果';render()}catch(e){$('#sub').textContent='搜索失败：'+e.message}}
function render(){const list=$('#list');list.innerHTML='';state.tracks.forEach((t,i)=>{const row=document.createElement('div');row.className='row'+(i===state.index?' on':'');const isFav=state.favs.some(f=>f.id===t.id);
row.innerHTML='<div class="no">'+(i+1)+'</div><div class="cv" '+(t.cover?'style="background-image:url(\''+t.cover+'\')"':'')+'>'+(t.cover?'':esc(t.name.slice(0,1)))+'</div><div class="meta"><b>'+esc(t.name)+'</b><i>'+esc(t.artist)+(t.album?' · '+esc(t.album):'')+'</i></div><div class="act"><button class="iconbtn '+(isFav?'fav':'')+'" data-fav="'+i+'" title="收藏"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 00-7.8 0L12 5.6l-1-1a5.5 5.5 0 00-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 000-7.8z"/></svg></button><button class="iconbtn" data-dl="'+i+'" title="下载"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg></button></div>';
row.onclick=(e)=>{if(e.target.closest('[data-fav]')){toggleFav(i);return}if(e.target.closest('[data-dl]')){download(i);return}play(i)};list.appendChild(row)})}
function markRow(){const rows=$('#list').children;for(let i=0;i<rows.length;i++)rows[i].classList.toggle('on',i===state.index)}
async function play(i){const t=state.tracks[i];if(!t)return;state.index=i;markRow();$('#npT').textContent=t.name;$('#npA').textContent=t.artist;$('#npCv').style.backgroundImage=t.cover?'url(\''+t.cover+'\')':'none';$('#npCv').style.backgroundSize='cover';
try{const d=await api({types:'url',id:t.id,br:320,source:t.source||state.source});if(!d.url){toast('这个音源没有版权，切一个音源再试');return}au.src=d.url;au.play();$('#brTag').textContent=(d.br?d.br+'k':'')+(d.size?' · '+(d.size/1048576).toFixed(1)+'MB':'');pushHist(t);loadLyric(t.id)}catch(e){toast('取播放地址失败：'+e.message)}}
function toggle(){if(!au.src)return;if(au.paused)au.play();else au.pause()}
au.onplay=()=>{$('#bPlay').innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>'};
au.onpause=()=>{$('#bPlay').innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>'};
au.ontimeupdate=()=>{const d=au.duration||0;$('#fill').style.width=d?(au.currentTime/d*100)+'%':'0%';$('#tNow').textContent=fmt(au.currentTime);$('#tAll').textContent=fmt(d);if(state.lyric.length)syncLyric(au.currentTime)};
au.onerror=()=>{if(au.src)toast('播放失败，换个音源试试')};
function next(){if(!state.tracks.length)return;play((state.index+1)%state.tracks.length)}
function prev(){if(!state.tracks.length)return;play((state.index-1+state.tracks.length)%state.tracks.length)}
async function loadLyric(id){state.lyric=[];state.lyricIdx=-1;$('#lyricBody').innerHTML='';
try{const d=await api({types:'lyric',id:id});const raw=(d.lyric||'');state.lyric=raw.split(/\n/).map(l=>{const m=l.match(/\[(\d+):(\d+(?:\.\d+)?)\](.*)/);if(!m)return null;return{t:(+m[1])*60+parseFloat(m[2]),s:m[3].trim()}}).filter(x=>x&&x.s);$('#lyricBody').innerHTML=state.lyric.map((l,i)=>'<div class="ln" data-i="'+i+'">'+esc(l.s)+'</div>').join('')}catch(e){$('#lyricBody').innerHTML='<div class="ln">没有歌词</div>'}}
function syncLyric(cur){let idx=-1;for(let i=0;i<state.lyric.length;i++){if(state.lyric[i].t<=cur)idx=i;else break}if(idx===state.lyricIdx)return;state.lyricIdx=idx;const nodes=$('#lyricBody').children;for(let i=0;i<nodes.length;i++)nodes[i].classList.toggle('on',i===idx);if(nodes[idx]&&nodes[idx].scrollIntoView)nodes[idx].scrollIntoView({block:'center',behavior:'smooth'})}
function toggleFav(i){const t=state.tracks[i];if(!t)return;const k=state.favs.findIndex(f=>f.id===t.id);if(k>=0){state.favs.splice(k,1);toast('已取消收藏')}else{state.favs.unshift(t);toast('已收藏')}localStorage.setItem('otter_favs',JSON.stringify(state.favs));renderFavs();render()}
function pushHist(t){state.hist=state.hist.filter(x=>x.id!==t.id);state.hist.unshift(t);state.hist=state.hist.slice(0,30);localStorage.setItem('otter_hist',JSON.stringify(state.hist))}
function renderFavs(){const box=$('#favList');box.innerHTML=state.favs.slice(0,12).map((f,i)=>'<div class="it" data-fav-i="'+i+'">'+esc(f.name)+'</div>').join('')||'<div class="it" style="color:#5b6a7b">还没有收藏</div>';[...box.children].forEach(el=>{const i=el.dataset.favI;if(i!=null)el.onclick=()=>{state.tracks=state.favs.slice();$('#title').textContent='我的收藏';$('#sub').textContent=state.favs.length+' 首';render();play(+i)}})}
async function download(i){const t=state.tracks[i||state.index];if(!t)return toast('先选一首歌');toast('正在准备下载…');
try{const d=await api({types:'url',id:t.id,br:320,source:t.source||state.source});if(!d.url)return toast('这个音源没有版权，换音源再试');const r=await fetch(d.url);const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=t.artist+' - '+t.name+'.mp3';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('已开始下载')}catch(e){toast('下载失败：'+e.message)}}
document.querySelectorAll('#navCharts a').forEach(a=>{a.onclick=()=>{document.querySelectorAll('#navCharts a').forEach(x=>x.classList.remove('on'));a.classList.add('on');state.source='netease';$('#src').value='netease';loadChart(a.dataset.chart)}});
$('#navFav').onclick=()=>{if(!state.favs.length)return toast('还没有收藏的歌');state.tracks=state.favs.slice();$('#title').textContent='我的收藏';$('#sub').textContent=state.favs.length+' 首';render()};
$('#navHis').onclick=()=>{if(!state.hist.length)return toast('还没有播放记录');state.tracks=state.hist.slice();$('#title').textContent='最近播放';$('#sub').textContent=state.hist.length+' 首';render()};
$('#btnSearch').onclick=doSearch;$('#q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
$('#bPlay').onclick=toggle;$('#bNext').onclick=next;$('#bPrev').onclick=prev;$('#bDl').onclick=()=>download();
$('#vol').oninput=e=>{au.volume=+e.target.value/100};
$('#bar').onclick=e=>{if(!au.duration)return;const r=$('#bar').getBoundingClientRect();au.currentTime=((e.clientX-r.left)/r.width)*au.duration};
$('#btnLyric').onclick=()=>$('#lyric').classList.toggle('show');
$('#src').onchange=e=>{state.source=e.target.value;toast('音源已切到 '+e.target.selectedOptions[0].text)};
$('#bLoop').onclick=()=>{state.loop=(state.loop+1)%3;toast(['列表循环','单曲循环','顺序播放'][state.loop])};
au.onended=()=>{if(state.loop===1){au.currentTime=0;au.play()}else next()};
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.code==='Space'){e.preventDefault();toggle()}});
renderFavs();loadChart('3778678');
</script>
</body>
</html>
